# Clash YAML 样本：机场把「订阅信息」当成节点写进来的真实形状
#
# 【2026-10-20 真机事件】飞鸟云那批 35 个节点里混了 6 条**根本不是节点**的信息：
#   「剩余流量：596.22 GB」「套餐到期：长期有效 (2)」
#   「有超过20多个节点，不够请到官网使用文档…」
#   「每次使用前更新订阅到最新…」「电报群https://t.me/…」「防失联页https://github.com/…」
# 它们**参数齐全**（server/port/密码都有）⇒ 缺参检测抓不到 ⇒ 只能按**名字内容**判。
#
# 这些条目必须：
#   ① 不进内核代理表、不进测速集合；
#   ② 在 UnusableLedger 里留一条账（用户能看到"这个订阅里有 N 条信息被跳过"）；
#   ③ 原因写「订阅信息条目，非节点」，**不许**写成「网络不可达/超时/失败」；
#   ④ 不许被当成 DNS 类（DNS 类 = 节点定义正确但域名这次没解析出来）。
#
# 最后一条 Y-HK-01 是**真节点**，用来证明判据没有误杀正常名。
# 全部是假凭据 / example.test 域名，不得含任何真实凭据。
proxies:
  - name: "剩余流量：596.22 GB"
    type: vless
    server: info-flow.example.test
    port: 443
    uuid: 11111111-1111-4111-8111-111111111111
    tls: true
    servername: www.example.test
  - name: "套餐到期：长期有效 (2)"
    type: vless
    server: info-expire.example.test
    port: 443
    uuid: 22222222-2222-4222-8222-222222222222
    tls: true
    servername: www.example.test
  - name: "有超过20多个节点，不够请到官网使用文档"
    type: vless
    server: info-doc.example.test
    port: 443
    uuid: 33333333-3333-4333-8333-333333333333
    tls: true
    servername: www.example.test
  - name: "每次使用前更新订阅到最新"
    type: vless
    server: info-update.example.test
    port: 443
    uuid: 44444444-4444-4444-8444-444444444444
    tls: true
    servername: www.example.test
  - name: "电报群https://t.me/feiniaoyunjichang"
    type: vless
    server: info-tg.example.test
    port: 443
    uuid: 55555555-5555-4555-8555-555555555555
    tls: true
    servername: www.example.test
  - name: "防失联页https://github.com/feiniaoyun"
    type: vless
    server: info-page.example.test
    port: 443
    uuid: 66666666-6666-4666-8666-666666666666
    tls: true
    servername: www.example.test
  - name: "Y-HK-01"
    type: vless
    server: hk-real-node.example.test
    port: 443
    uuid: 77777777-7777-4777-8777-777777777777
    tls: true
    servername: www.example.test
